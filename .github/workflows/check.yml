name: Check

on:
  push:
    branches: [main]
  pull_request:
  # Allow manual runs from the Actions tab.
  workflow_dispatch:
  # Let release.yml call this workflow and gate the release job on it — a
  # tag push doesn't match branches: [main] above, so without this a tagged
  # commit could release without ever running these checks.
  workflow_call:

jobs:
  # Lint then test, via the same `make test` a developer runs locally —
  # one command, not a hand-maintained parallel sequence of CI-only steps.
  # No API key needed — tests don't call the model.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          # Pinned, not "stable": golangci-lint trails new Go releases,
          # so this needs to stay a version golangci-lint supports —
          # bump deliberately, not automatically.
          go-version: "1.26"
      - name: Install golangci-lint
        run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.12.2
      - name: Test
        run: make test

  # Markdown formatting and structure. ubuntu-latest ships with Node/npm.
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Prettier and markdownlint-cli2 through npx, at the versions pinned
      # in .markdown-tool-versions. --check rewrites nothing.
      - name: Check Markdown
        run: bin/format-markdown --check
