version: 2

project_name: catalog

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/catalog
    binary: catalog
    env:
      # Pure Go — no cgo needed.
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      # Strip debug info and symbol table to reduce binary size.
      # Inject the release tag as the version string.
      - -s -w -X main.version={{.Version}}

notarize:
  macos:
    - enabled: "{{ not .IsSnapshot }}"
      sign:
        certificate: "{{.Env.MACOS_CERTIFICATE}}"
        password: "{{.Env.MACOS_CERTIFICATE_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: catalog
    binaries:
      - catalog
    homepage: https://github.com/westarete/catalog
    # brew style requires: under 80 chars, no trailing period.
    description: Keeps a catalog.md current in each cataloged folder
    repository:
      owner: westarete
      name: homebrew-tap
      branch: main
      # Fine-grained PAT with write access to both this repo and the tap repo.
      # Store as HOMEBREW_TAP_TOKEN in this repo's secrets.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaserbot
    commit_msg_template: "Update catalog to {{ .Tag }}"
    # Homebrew runs an installer script outside its sandbox, as the person
    # who ran `brew install` and without sudo (the script sets no `sudo:`).
    # `--agent-only` writes the launch agent and loads it without asking
    # questions. custom_block goes at the top of the cask. macOS only,
    # because the launch agent is a macOS feature.
    custom_block: |
      on_macos do
        installer script: {
          executable: "catalog",
          args:       ["setup", "--agent-only"],
        }
      end
    # A plain `brew uninstall` removes the launch agent and keeps the
    # person's settings and summaries.
    uninstall:
      launchctl:
        - com.westarete.catalog
    # `brew uninstall --zap` deletes the settings folder, which holds the
    # API key and summaries of the person's documents, and the log. Use
    # `delete`, not `trash`: Trash would keep them readable.
    zap:
      delete:
        - ~/Library/Application Support/com.westarete.catalog
        - ~/Library/Logs/catalog.log
    caveats: |
      Run `catalog setup` to add an API key and choose the folders to watch,
      then `catalog status` to see how the daemon is doing.

      `brew uninstall catalog` keeps your settings and summaries.
      `brew uninstall --zap catalog` deletes them.
